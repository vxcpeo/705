<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="t d">
<title id="t">Pretiola settlement split figure</title>
<desc id="d">A ruled settlement table splits one assumed $280.00 settlement into income of $262.50, the part up to K, and upside of $17.50, the part above K. A two-leg meter shows the per-unit price share as flat bars: income 98.92% and upside 1.08% of the $250.00 spot. Illustrative model values only.</desc>
