<title id="t">Pretiola mark</title>
<desc id="d">The Pretiola pip: a P struck from ledger rules — a full-height ink stem, a squared top rule that turns into the bowl wall, a middle rule that closes the bowl, and a flare-orange pip set just past it — on a paper ground.</desc>
